name: Source and documentation quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TSAAT_SQL_INTEGRATION: '0'
      DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install and compile both providers with Node outbound traffic denied
        shell: powershell
        run: ./scripts/ci-offline.ps1
      - run: npm run test:nosql
      - name: Verify tracked source stayed clean
        run: git diff --exit-code
